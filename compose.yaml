name: solo84-seedbench
services:
  desk:
    build:
      context: .
      args:
        SEEDBENCH_RUNTIME_IMAGE: ${SEEDBENCH_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${SEEDBENCH_IMAGE:-solo84-seedbench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${SEEDBENCH_PORT:-19884}:8000"
    volumes:
      - seed-library:/var/lib/seedbench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/seed/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  seed-library:
